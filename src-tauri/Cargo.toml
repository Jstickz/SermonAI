[package]
name = "sermonai"
version = "0.1.0"
description = "Real-time sermon transcription, scripture display and sermon intelligence"
authors = ["SermonAI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sermonai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is deliberately absent: it needs a matching assetProtocol
# scope in tauri.conf.json, and we only need local-file access when theme
# backgrounds (images and looping video) land in M3. Add both together.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

# Audio capture: WASAPI on Windows, CoreAudio on macOS (PRD §10.2).
cpal = "0.15"

# Storage: bundled SQLite with FTS5 and WAL (PRD §14).
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Network: Deepgram WebSocket, API.Bible, Anthropic, pack downloads.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Phone remote and OBS overlay servers, LAN only and off by default (PRD §10.3).
axum = { version = "0.7", features = ["ws"] }

# Query tokenization for the bundled static encoder (FR-15). Pure Rust, no
# ONNX runtime: the encoder is a token lookup plus a mean.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Pack integrity (FR-61).
sha2 = "0.10"
hex = "0.4"

chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
dotenvy = "0.15"

# Added when their milestone lands, so the base installer stays under 40 MB (FR-59):
#   whisper-rs   — offline STT, loaded from the Offline Speech Pack (M5)
#   llama-cpp-2  — optional Offline Intelligence Pack (M5)
#   docx-rs      — transcript and derivative exports (M9)
#   ndi-sys      — NDI lower third, shipped as an optional pack (M7)

[features]
# Tauri's default: production builds strip the devtools.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Was opt-level = "s" to protect the 40 MB gate. Measured, that trade was
# wrong twice over: the installer came in at 5 MB with ~15 MB of headroom, and
# "s" left the verse-search loop unvectorised at 15.98 ms against FR-15's 5 ms
# budget. Speed matters here; the size gate is enforced by CI either way.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Integration tests spin up a local range-capable server to stand in for the
# Pack CDN, so they need these directly rather than through the lib.
[dev-dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
